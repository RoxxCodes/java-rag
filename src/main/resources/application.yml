server:
  port: 8080

spring:
  application:
    name: rag-application
  datasource:
    # Using existing PostgreSQL Docker container (tribe-pg) on port 5432
    url: jdbc:postgresql://localhost:5432/ragdb
    username: postgres
    password: tribe
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# LLM Provider Configuration
# Available options: google, openai
# Priority: If preferred provider is not available (no API key), falls back to first available
llm:
  provider: google  # Change to "openai" to use OpenAI instead
  embedding-dimension: 384  # 384 for all-MiniLM-L6-v2, 1536 for OpenAI

# Google AI Gemini Configuration (Free tier: 60 requests/minute)
# Get your API key from: https://aistudio.google.com/app/apikey
google:
  api-key: ${GOOGLE_API_KEY:}
  model: gemini-2.5-flash

# OpenAI Configuration (Optional - only used if llm.provider=openai)
# Set both GOOGLE_API_KEY and OPENAI_API_KEY to switch between them at runtime
openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini
  embedding-model: text-embedding-ada-002

# Logging
logging:
  level:
    com.example.rag: INFO
    dev.langchain4j: INFO
